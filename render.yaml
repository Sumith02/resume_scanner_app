services:
  - type: web
    name: nexerra-talent-os
    runtime: docker
    plan: free # or starter
    region: oregon # or ohio, frankfurt, singapore
    dockerfilePath: Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8000
      - key: APP_ENV
        value: production
      - key: APP_SECRET_KEY
        generateValue: true
      - key: ALLOW_DEMO_MODE
        value: "true"
      # Supabase Production Database (Uncomment and set in Render dashboard)
      # - key: SUPABASE_URL
      #   sync: false
      # - key: SUPABASE_PUBLIC_KEY
      #   sync: false
      # - key: SUPABASE_SECRET_KEY
      #   sync: false
