version: "3.8"

services:
  nexerra-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - APP_SECRET_KEY=change-this-secret-key-in-production-min-32-chars
      - APP_ORIGIN=http://localhost:8000
      # If using Supabase in production, uncomment and set:
      # - SUPABASE_URL=https://your-project.supabase.co
      # - SUPABASE_SECRET_KEY=your-service-role-key
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped
