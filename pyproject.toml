[project]
name = "nexerra-talent-os"
version = "1.0.0"
description = "Multi-tenant recruitment operating system (Nexerra Talent OS rebuild)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141,<1",
    "uvicorn>=0.35,<1",
    "pydantic>=2.11,<3",
    "pypdf>=6,<7",
    "python-docx>=1.2,<2",
    "python-multipart>=0.0.20,<1",
    "PyJWT>=2.14,<3",
    "SQLAlchemy>=2.0,<3",
    "email-validator>=2.2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "httpx>=0.28,<1",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
  "B008",  # FastAPI Depends()/File() in default args is the framework idiom
]
