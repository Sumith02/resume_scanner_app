[project]
name = "resumeflow-api"
version = "2.0.0"
description = "Production FastAPI backend for ResumeFlow HR"
requires-python = ">=3.12,<3.14"
dependencies = [
  "cryptography>=45,<47",
  "fastapi>=0.117,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pypdf>=6,<7",
  "python-docx>=1.2,<2",
  "python-dotenv>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "supabase>=2.18,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=7,<8",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.vercel]
entrypoint = "api/index.py"
